<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Affiliate Product Review (9:16 vertical)</title>
  <style>
    /* Agentika Content Engine — 9:16 affiliate template.
       Motion Lab rules enforced: NO purple/blue gradient, NO glow,
       NO floating particles, NO centered clutter; every sifat -> angka. */
    :root {
      --bg: #0e0f12;
      --ink: #f4f5f7;
      --muted: #8b8f98;
      --price: #e6a93d;
      --cta: #e6a93d;
      --safe: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; background: var(--bg); color: var(--ink);
                 font-family: "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
    #stage { position: relative; width: 100%; height: 100%; }

    /* SAFE CAPTION ZONE: platform UI (TikTok/Reels) sits in the bottom ~20%
       (~384px tall from canvas bottom at y=1536). Caption copy must stay above
       y=1536 — never inside that strip. */
    #caption-zone {
      position: absolute; left: 0; right: 0; bottom: 192px; height: 384px;
      background: rgba(14,15,18,.88);
      display: flex; align-items: center; justify-content: center;
    }
    #caption-text { width: 92%; font-size: 44px; line-height: 1.28; font-weight: 700;
                    color: var(--safe); letter-spacing: -.5px; text-align: center; }

    .eyebrow { position: absolute; top: 140px; left: 72px; font-size: 26px;
               letter-spacing: 4px; text-transform: uppercase; color: var(--muted); }
    #product-img { position: absolute; top: 200px; left: 50%;
                   width: 560px; height: 560px; object-fit: cover; border-radius: 40px;
                   background: #1b1d22; border: 6px solid rgba(230,169,61,.45);
                   will-change: transform, opacity; }
    #product-name { position: absolute; top: 840px; left: 0; right: 0;
                    text-align: center; font-size: 62px; font-weight: 800;
                    letter-spacing: -2px; }
    #price-tag { position: absolute; top: 960px; left: 0; right: 0;
                 text-align: center; font-size: 74px; font-weight: 900;
                 color: var(--price); letter-spacing: -3px; }
    #bullet { position: absolute; top: 1090px; left: 96px; right: 96px;
              font-size: 38px; line-height: 1.5; color: var(--muted); }
    #bullet span { color: var(--ink); }
    #cta { position: absolute; bottom: 280px; left: 50%; transform: translateX(-50%);
           width: 640px; height: 150px; border: none; border-radius: 32px;
           background: var(--cta); color: #0e0f12; font-size: 48px;
           font-weight: 900; letter-spacing: 1px; cursor: pointer;
           will-change: transform, opacity; }
    #logo { position: absolute; top: 80px; right: 72px; font-size: 24px;
            letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
  </style>
</head>
<body>
  <div id="stage">
    <div id="logo">Agentika &middot; Affiliate</div>

    <div class="eyebrow">Review Produk Terbaru</div>
    <img id="product-img" src="../assets/avatar.jpg" alt="produk" />
    <div id="product-name">Produk Unggulan Kami</div>
    <div id="price-tag">Rp99.000</div>

    <div id="bullet"><span>&bull; Fitur 1:</span> manfaat paling diingini penjualan<br/>
                       <span>&bull; Fitur 2:</span> hemat waktu &amp; biaya sepanjang hari<br/>
                       <span>&bull; Fitur 3:</span> kualitas premium tanpa markup mewah</div>

    <button id="cta">BELI SEKARANG</button>

    <!-- Paste final captions here for Shorts/TikTok clearance:
         everything visible must end before y=1536 (bottom 20% safe zone). -->
    <div id="caption-zone">
      <div id="caption-text">Caption singkat produk ini bisa kamu tempel di sini.</div>
    </div>
  </div>

  <script>
    // Render contract: motion is a PURE function of frame time t (seconds).
    // Loop runs exactly DURATION; each render iterates N frames only, no wall clock,
    // no Math.random(). Seedable if ever needed by replacing t with a frame index.
    const DURATION = 14;
    function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
    function easeOutQuint(t){ return 1 - Math.pow(1 - t, 5); }
    function springDamped(p, damping){
      return Math.min(1, 1 - Math.exp(-(damping / 0.25) * p));
    }

    window.__timelines = window.__timelines || {};
    window.__timelines["affiliate-product-review"] = function(t) {
      const elImg   = document.getElementById("product-img");
      const elName  = document.getElementById("product-name");
      const elPrice = document.getElementById("price-tag");
      const elBul   = document.getElementById("bullet");
      const elCta   = document.getElementById("cta");

      const imgP = clamp01(t / 0.35);
      elImg.style.opacity = String(easeOutQuint(imgP));
      elImg.style.transform =
        "translateX(-50%) scale(" + (0.55 + 0.45 * springDamped(imgP, 0.8)) + ")";

      const nameP = clamp01((t - 0.35) / 0.25);
      elName.style.opacity = String(nameP);
      elName.style.transform = "translateY(" + ((1 - nameP) * 60).toFixed(1) + "px)";

      const priceP = clamp01((t - 0.7) / 0.3);
      elPrice.textContent = "Rp" + Math.round(99000 * priceP).toLocaleString("id-ID");
      elPrice.style.opacity = String(priceP);

      const bP = clamp01((t - 1.1) / 0.4);
      elBul.style.opacity = String(bP);
      elBul.style.transform = "translateY(" + ((1 - bP) * 30).toFixed(1) + "px)";

      const cP = clamp01((t - 2.2) / 0.25);
      elCta.style.opacity = String(cP);
      elCta.style.transform = "translateX(-50%) scale(" +
        (0.8 + 0.2 * springDamped(cP, 0.8)).toFixed(3) + ")";

      if (t >= DURATION - 2) {
        const f = 0.85 + 0.15 * Math.sin(((t - (DURATION - 2)) / 0.6) * Math.PI * 2);
        elCta.style.filter = "brightness(" + f.toFixed(3) + ")";
      }
    };
  </script>
</body>
</html>
